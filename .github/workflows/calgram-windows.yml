name: Calgram Windows

# Builds Calgram.exe (64-bit Windows) on GitHub's free Windows machines.
# Based on Telegram's own win.yml. Differences:
#   - x64 only, one configuration;
#   - our api_id/api_hash from the CALGRAM_API_ID / CALGRAM_API_HASH
#     secrets (Telegram's limited test keys when they're not set yet);
#   - auto-update and crash reports off: the official updater would
#     replace Calgram with official Telegram, and crash dumps would go
#     to Telegram;
#   - the compiled libraries are saved after every run, even a failed or
#     timed-out one, so the first (very long) build can finish over
#     several runs: re-run the workflow and it continues where it stopped.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Debug builds faster; Release is what agents get."
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [calgram]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog.txt'

concurrency:
  group: calgram-windows-${{ github.ref }}
  cancel-in-progress: false  # queue, never throw away a long library build

jobs:
  windows:
    name: Calgram x64 (${{ inputs.config || 'Debug' }})
    runs-on: windows-latest
    timeout-minutes: 360

    # attestations: GitHub signs a record that Calgram.exe was built here,
    # from this exact commit of the public code (build provenance).
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      CALGRAM_CONFIG: ${{ inputs.config || 'Debug' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      # A Release build compiles Qt twice (debug + release) and C: has only
      # ~28 GB free next to everything GitHub preinstalls. Drop big tools we
      # never use.
      - name: Free disk space (Release).
        if: (inputs.config || 'Debug') == 'Release'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          $paths = @(
            'C:\Android', 'C:\ghcup', 'C:\cabal', 'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL', 'C:\Program Files\R', 'C:\SeleniumWebDrivers',
            'C:\tools\kotlinc', 'C:\Program Files\Amazon',
            'C:\hostedtoolcache\windows\go', 'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk', 'C:\hostedtoolcache\windows\stack',
            'C:\ProgramData\chocolatey\lib\pulumi', 'C:\ProgramData\chocolatey\lib\maven'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) { cmd /c "rmdir /s /q `"$path`" 2>nul" }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      # The Release compile ran out of memory (C1060 "out of heap space")
      # on the runner's 16 GB. A big page file on D: gives it room.
      - name: Larger page file.
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Prepare directories.
        # Libraries stay at Telegram's path on C: - prepare.py resolves real
        # paths and the cached libraries record them. Calgram's own build
        # output goes to D: (see "Build output on D:").
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "$CALGRAM_CONFIG" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "calgram@localhost"
          git config --global user.name "Calgram CI"

      # Release also builds breakpad's dump_syms, which needs ATL for the
      # v14.44 toolset; GitHub's Windows image doesn't include it.
      - name: Install ATL for v14.44 (Release).
        if: env.CALGRAM_CONFIG == 'Release'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"
          $p = Start-Process -FilePath "$installer\vs_installer.exe" -Wait -PassThru -ArgumentList `
            'modify','--installPath',"`"$vs`"", `
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', `
            '--quiet','--norestart','--nocache'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
          Get-ChildItem "$vs\VC\Tools\MSVC\14.44*\atlmfc\include\atlbase.h"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: calgram-third-party-${{ env.CACHE_KEY }}
          restore-keys: calgram-third-party-${{ env.CACHE_KEY }}-

      - name: Restore Libraries.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: calgram-libs-${{ env.CACHE_KEY }}
          restore-keys: calgram-libs-${{ env.CACHE_KEY }}-

      - name: Restore Qt.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: calgram-qt-${{ env.CACHE_KEY }}
          restore-keys: calgram-qt-${{ env.CACHE_KEY }}-

      - name: Fingerprint libraries before.
        shell: bash
        run: |
          fp() { find "$TBUILD/ThirdParty/cache_keys" "$LibrariesPath/cache_keys" -type f -exec sha256sum {} + 2>/dev/null | sort | sha256sum | cut -c1-16; }
          echo "LIBS_BEFORE=$(fp)" >> $GITHUB_ENV

      # The prune below used to strip tlottie / wallet-engine / tdesktop_rust
      # (incl. the generated wallet_engine.cpp the app compiles) while their
      # stage keys stayed valid. If a restored cache is like that, drop those
      # keys so just these three stages rebuild.
      - name: Repair pruned wallet sources.
        shell: bash
        run: |
          if [ -f "$LibrariesPath/cache_keys/tdesktop_rust" ] && [ ! -f "$LibrariesPath/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp" ]; then
            echo "wallet_engine.cpp missing from the cache - rebuilding tlottie, wallet-engine, tdesktop_rust."
            rm -f "$LibrariesPath/cache_keys/tlottie" "$LibrariesPath/cache_keys/wallet-engine" "$LibrariesPath/cache_keys/tdesktop_rust"
          else
            echo "Nothing to repair."
          fi

      # Debug needs only the debug libraries (skip-release); Release builds both.
      - name: Libraries.
        id: libs
        timeout-minutes: 290
        run: |
          if "%CALGRAM_CONFIG%"=="Debug" (set SKIP=skip-release) else (set SKIP=)
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat %SKIP% silent

      - name: Free up some disk space.
        if: always() && steps.libs.outcome != 'skipped'
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tlottie/*' -o -path '*/wallet-engine/*' -o -path '*/tdesktop_rust/*' ')' -type f ')' -o -empty ')' -delete

      - name: Did the libraries change?
        id: libs-changed
        if: always() && steps.libs.outcome != 'skipped'
        shell: bash
        run: |
          fp() { find "$TBUILD/ThirdParty/cache_keys" "$LibrariesPath/cache_keys" -type f -exec sha256sum {} + 2>/dev/null | sort | sha256sum | cut -c1-16; }
          AFTER=$(fp)
          echo "before $LIBS_BEFORE, after $AFTER"
          [ "$AFTER" != "$LIBS_BEFORE" ] && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      # Saved even when the Libraries step failed or ran out of time, so the
      # next run continues from here instead of starting over.
      - name: Save ThirdParty.
        if: always() && steps.libs-changed.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: calgram-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries.
        if: always() && steps.libs-changed.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: calgram-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt.
        if: always() && steps.libs-changed.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: calgram-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: API keys.
        shell: bash
        env:
          API_ID: ${{ secrets.CALGRAM_API_ID }}
          API_HASH: ${{ secrets.CALGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Using Calgram's own api_id."
            echo "CALGRAM_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::warning::CALGRAM_API_ID / CALGRAM_API_HASH secrets not set - using Telegram's test keys. Login may fail; don't give this build to agents."
            echo "CALGRAM_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      # Calgram's own compile output is tens of GB - more than C: has left.
      # D: has ~220 GB; run_cmake.py keeps an existing out folder.
      - name: Build output on D:.
        run: |
          if not exist %TBUILD%\%REPO_NAME%\out (
            mkdir D:\calgram-out
            mklink /J %TBUILD%\%REPO_NAME%\out D:\calgram-out
          )

      - name: Calgram build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          %CALGRAM_API% ^
          -D CMAKE_CONFIGURATION_TYPES=%CALGRAM_CONFIG% ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %CALGRAM_CONFIG% --parallel

      - name: Package.
        shell: bash
        run: |
          mkdir -p artifact
          cp "$TBUILD/$REPO_NAME/out/$CALGRAM_CONFIG/Telegram.exe" artifact/Calgram.exe
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          # The fingerprint anyone can compare with PowerShell's
          # Get-FileHash Calgram.exe
          sha256sum artifact/Calgram.exe | tee artifact/Calgram.exe.sha256.txt

      # Signed proof, kept by GitHub, that this Calgram.exe came from this
      # commit of the public code. Check it: the repo's Actions ->
      # Attestations page, or `gh attestation verify Calgram.exe -R
      # Erwin-knwy/Calgram`. See CALGRAM.md "Proving a download".
      - uses: actions/attest-build-provenance@v2
        name: Sign build provenance.
        with:
          subject-path: artifact/Calgram.exe

      - uses: actions/upload-artifact@v7
        name: Upload Calgram.
        with:
          name: Calgram-${{ env.CALGRAM_CONFIG }}-${{ env.SHORT_SHA }}
          path: artifact\
          retention-days: 30
